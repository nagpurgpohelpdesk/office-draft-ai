<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OfficeDraft AI | Official Document Generator</title>

  <meta
    name="description"
    content="Create concise official note sheets and letters with OfficeDraft AI."
  >

  <style>
    :root {
      --primary: #991b1b;
      --primary-dark: #7f1d1d;
      --green: #166534;
      --background: #f3f6fb;
      --border: #d1d5db;
      --text: #1f2937;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    header {
      padding: 24px 16px;
      color: white;
      background: linear-gradient(135deg, #991b1b, #7f1d1d);
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 9px;
      border: 1px solid #ffffff70;
      border-radius: 20px;
      font-size: 11px;
    }

    main {
      max-width: 1050px;
      margin: 24px auto;
      padding: 0 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      min-width: 0;
      padding: 22px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000008;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .description {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: white;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #fecaca;
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      line-height: 1.65;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }

    button {
      padding: 12px 15px;
      border: 0;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #e5e7eb;
      color: var(--text);
    }

    .success {
      background: var(--green);
      color: white;
    }

    .full-width {
      width: 100%;
    }

    .hidden {
      display: none !important;
    }

    .status {
      margin-top: 14px;
      padding: 11px;
      border-radius: 7px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status.error {
      background: #fef2f2;
      color: #991b1b;
    }

    .status.success-message {
      background: #f0fdf4;
      color: #166534;
    }

    .status.warning {
      background: #fffbeb;
      color: #92400e;
    }

    .analysis {
      margin-top: 14px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.7;
    }

    .analysis ul {
      padding-left: 19px;
    }

    .analysis li {
      margin: 5px 0;
    }

    .document-label {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 9px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .help {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    footer {
      padding: 24px 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 23px;
      }

      .card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>OfficeDraft AI</h1>
    <p>Official Note Sheet & Letter Generator</p>
    <p>Simple English. Clear references. Professional drafts.</p>
    <span class="badge">Independent Prototype · Version 2</span>
  </div>
</header>

<main>
  <div class="grid">

    <section class="card">
      <h2>Create a Draft</h2>

      <p class="description">
